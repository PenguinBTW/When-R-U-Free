name: whenrufree
description: "When R U Free — find when friends between lessons are free to hang out."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + persistence (local-first)
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.20.2
  share_plus: ^11.0.0

  # Cloud backend (wired up, disabled until keys are filled in
  # lib/firebase_options.dart + lib/config/cloud_config.dart).
  firebase_core: ^3.12.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.5
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^10.3.1
  app_links: ^7.0.0
  crypto: ^3.0.7
  flutter_timezone: ^5.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
